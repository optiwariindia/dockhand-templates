services:
  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DOCKER_ENABLE_SECURITY: ${DOCKER_ENABLE_SECURITY}
      TZ: ${TZ}
    volumes:
      - ${DATA_PATH}/trainingData:/usr/share/tesseract-ocr/4.00/tessdata
      - ${DATA_PATH}/extraConfigs:/configs
