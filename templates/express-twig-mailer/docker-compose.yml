services:
  express-twig-mailer:
    image: optiwariindia/express-twig-mailer:latest
    container_name: express-twig-mailer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      TZ: ${TZ}
